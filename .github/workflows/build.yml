name: Costruisci immagine app

on:
  push:
    branches: [main]
    paths:
      - "inventario_casa/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
          - arch: amd64
            platform: linux/amd64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Calcola nome e versione
        id: v
        run: |
          version=$(awk '/^version:/ {gsub(/"/, "", $2); print $2}' inventario_casa/config.yaml)
          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "owner=${owner}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: inventario_casa
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/${{ steps.v.outputs.owner }}/${{ matrix.arch }}-addon-inventario-casa:${{ steps.v.outputs.version }}
