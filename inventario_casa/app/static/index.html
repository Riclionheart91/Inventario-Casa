<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<script>(function(){try{var h=document.documentElement,t=localStorage.getItem("tema")||"auto",x=localStorage.getItem("testo")||"normale";h.dataset.tema=t;h.dataset.testo=x;var m=document.querySelector("meta[name=theme-color]");if(m&&(t==="chiaro"||(t==="auto"&&window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches)))m.setAttribute("content","#f2f2f7")}catch(e){}})();</script>
<title>Inventario</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css?v=0.24.1">
<link rel="stylesheet" href="ios.css?v=0.24.1">
<link rel="stylesheet" href="ios2.css?v=0.24.1">
<link rel="stylesheet" href="tema.css?v=0.24.1">
</head>
<body>
<div id="app">
<header class="top"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
<div class="grow"><h1 id="title">Movimento +/-</h1><div id="sub" class="sub">Home Assistant · accesso protetto</div></div><button type="button" id="imp-btn" aria-label="Impostazioni" style="background:none;border:0;color:inherit;font-size:20px;padding:8px;cursor:pointer">⚙</button><a id="esci" href="esci" hidden style="color:inherit;font-size:13px;padding:8px;opacity:.8">Esci</a></header>

<main>
<div class="large"><h1 id="ltitle" aria-hidden="true"></h1><div class="lsub" id="lsub" aria-hidden="true"></div></div>
<section id="v-mov" class="view" aria-labelledby="title">
<form id="f" autocomplete="off">
<div class="field"><label for="bc">Barcode</label>
<div class="row"><input id="bc" type="text" inputmode="numeric" placeholder="Scansiona o digita" enterkeyhint="go">
<button type="button" id="scan" class="sq" aria-label="Scansiona con la fotocamera"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V5a1 1 0 011-1h3M16 4h3a1 1 0 011 1v3M20 16v3a1 1 0 01-1 1h-3M8 20H5a1 1 0 01-1-1v-3"/><path d="M8 9v6M12 9v6M16 9v6"/></svg></button></div>
<div id="scanbox" hidden><video id="vid" playsinline muted></video><button type="button" id="scanstop" class="btn ghost">Chiudi scanner</button></div>
<input id="scanfile" type="file" accept="image/*" capture="environment" class="sr" tabindex="-1" aria-label="Foto del codice a barre">
<div id="hint" class="note" role="status"></div>
<div id="foto" class="fotopair" hidden><label class="btn fotobtn" for="file"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span id="t-fronte">Foto fronte</span></label><input id="file" type="file" accept="image/*" capture="environment" class="sr"><label class="btn fotobtn" for="fileretro"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span id="t-retro">Foto retro</span></label><input id="fileretro" type="file" accept="image/*" capture="environment" class="sr"><div class="fprev"><img id="prev" alt="Fronte" hidden><img id="prevr" alt="Retro" hidden></div></div>
</div>
<div id="prop" class="prop" hidden></div>
<div class="field"><div class="lbl" id="l-tipo">Tipo</div><div class="seg" id="tipo" role="group" aria-labelledby="l-tipo"></div></div>
<div class="field" id="f-riga" hidden><div class="lbl" id="l-riga">Da dove</div><div class="seg one" id="riga" role="group" aria-labelledby="l-riga"></div><div id="rnote" class="note" role="status"></div></div>
<div class="field" id="f-catnew" hidden><label for="catnew">Nuova categoria</label><select id="catnew"></select></div>
<div class="field" id="f-luogo"><div class="lbl" id="l-luogo">Posizione</div><div class="seg" id="luogo" role="group" aria-labelledby="l-luogo"></div></div>
<div class="field qty"><div class="lbl" id="l-q">Quantità</div><div class="row"><button type="button" class="sq" id="qm" aria-label="Diminuisci">−</button><output id="qv" aria-labelledby="l-q">1</output><button type="button" class="sq" id="qp" aria-label="Aumenta">+</button></div></div>
<div class="field" id="f-scad"><label for="scad">Scadenza (facoltativa)</label><input id="scad" type="date"></div>
<div class="field"><label for="pr">Prodotto</label><input id="pr" type="text" placeholder="Si compila da solo se il codice è noto"><div id="cat" class="note"></div></div>
<div class="actions"><button type="button" id="cancel" class="btn ghost">Annulla</button><button type="submit" id="save" class="btn primary">Salva</button></div>
</form>
</section>

<section id="v-stock" class="view" hidden>
<div class="stk"><div class="field"><label for="q" class="sr">Cerca</label><input id="q" type="search" placeholder="Cerca prodotto o categoria"></div>
<div class="chips" id="chips" role="group" aria-label="Filtri"></div></div>
<div id="stock"></div>
</section>

<section id="v-prod" class="view" hidden>
<div class="stk"><div class="field"><label for="qp2" class="sr">Cerca un prodotto</label><input id="qp2" type="search" placeholder="Cerca tra tutti i prodotti"></div>
<div class="note" id="prod-sum" aria-live="polite"></div>
<button type="button" class="chip tipo-f" id="prod-tipo" aria-label="Togli il filtro del tipo" hidden></button>
<div class="chips cats" id="prod-cat" role="group" aria-label="Categoria"></div>
<div class="chips cats" id="prod-sotto" role="group" aria-label="Sottocategoria" hidden></div>
<div class="chips" id="prod-luogo" role="group" aria-label="Posizione"></div>
<div class="bar one"><div class="chips" id="prod-flt" role="group" aria-label="Filtra"></div><div class="chips fix"><button type="button" class="chip" id="prod-chiudi" title="Chiudi tutti i gruppi" aria-label="Chiudi tutti i gruppi">Chiudi</button><button type="button" class="chip" id="prod-apri" title="Apri tutti i gruppi" aria-label="Apri tutti i gruppi">Apri</button></div></div></div>
<div id="prodlist"></div>
</section>

<section id="v-spesa" class="view" hidden><div class="stk" id="spesa-top"></div><div id="spesa-list"></div></section>
<section id="v-bozze" class="view" hidden><p class="empty" id="da-fare-vuoto" hidden>Niente da inserire né da approvare.</p><div id="scad-list"></div><div id="bozze-list"></div><div id="appr"></div><div id="off-conf"></div></section>
<section id="v-off" class="view" hidden><div id="off"></div></section>
<section id="v-imp" class="view" hidden><div id="imp"></div></section>
</main>

<nav id="nav" aria-label="Sezioni"></nav>
<div id="scheda" role="dialog" aria-modal="true" aria-labelledby="sc-nome" hidden>
<div class="sc-bar"><button type="button" id="sc-close" class="sq" aria-label="Chiudi la scheda">←</button><b>Scheda prodotto</b></div>
<div id="sc-body" class="sc-body"></div>
<div class="sc-foot"><button type="button" id="sc-mov" class="btn primary">Carica o scarica</button></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="undo" role="status" hidden></div>
</div>
<script src="app.js?v=0.24.1"></script>
<script src="ios.js?v=0.24.1"></script>
<script src="imp_sic.js?v=0.24.1"></script>
<script src="imp_cop.js?v=0.24.1"></script>
</body>
</html>
